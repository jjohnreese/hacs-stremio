name: Cinema offline regressions
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install aiohttp PyYAML black==26.1.0 flake8==7.3.0
      - run: python -m unittest discover -s offline_tests -v
      - run: node --test offline_tests/frontend.test.mjs
      - name: Check modified Python modules
        run: |
          black --check custom_components/stremio/const.py custom_components/stremio/stremio_client.py custom_components/stremio/services.py custom_components/stremio/media_source.py custom_components/stremio/watch_state.py offline_tests
          flake8 custom_components/stremio/const.py custom_components/stremio/stremio_client.py custom_components/stremio/services.py custom_components/stremio/media_source.py custom_components/stremio/watch_state.py --max-line-length=120
      - name: Validate source and examples
        run: |
          python -m compileall -q custom_components/stremio
          python -c "import pathlib,yaml; [list(yaml.safe_load_all(p.read_text())) for p in pathlib.Path('examples').glob('*.yaml')]"

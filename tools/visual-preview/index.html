<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stremio Cinema — demonstration data</title>
<style>
:root { --primary-color:#ac7fff; --primary-text-color:#f4efff; --secondary-text-color:#aaa2bb; --text-primary-color:#fff; --card-background-color:#181323; --secondary-background-color:#231b32; --divider-color:rgba(186,150,239,.15); --ha-card-border-radius:22px; --ha-card-border-color:var(--divider-color); font-family:Arial,sans-serif; color:var(--primary-text-color); background:#100d19; }
body { margin:0; padding:28px; } main { max-width:1200px; margin:auto; } .label { color:#c8a9ff; font-size:11px; letter-spacing:.15em; } h1 { font-size:38px; margin:12px 0; letter-spacing:-1px; } p { color:var(--secondary-text-color); } .grid { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:20px; } .full { grid-column:1/-1; } ha-card { display:block; background:var(--card-background-color); border:1px solid var(--divider-color); border-radius:22px; } ha-icon { display:inline-block; width:1em; height:1em; } ha-icon:before { content:'◆'; font-size:.8em; color:var(--primary-color); } @media(max-width:700px) {body{padding:14px} .grid{grid-template-columns:minmax(0,1fr)} h1{font-size:28px}}
</style>
<main><div class="label">STREMIO / CINEMA · DEMONSTRATION DATA</div><h1>Your next great watch.</h1><p>Actual integration cards with fictional library and progress. No connection to a Home Assistant account.</p><div class="grid" id="cards"></div></main>
<script type="module">
import { LitElement, html, css } from 'https://esm.sh/lit@3.3.1';
import * as icons from 'https://esm.sh/@mdi/js@7.4.47';
LitElement.prototype.html=html; LitElement.prototype.css=css;
customElements.define('ha-panel-lovelace', class extends LitElement {});
customElements.define('ha-card', class extends HTMLElement { constructor(){ super(); this.attachShadow({mode:'open'}).innerHTML='<style>:host{display:block;background:var(--card-background-color);border:1px solid var(--divider-color);border-radius:22px;overflow:hidden}</style><slot></slot>'; } });
customElements.define('ha-icon', class extends HTMLElement {
 static get observedAttributes(){return ['icon'];}
 constructor(){super();this.attachShadow({mode:'open'});}
 attributeChangedCallback(_,old,value){const key='mdi'+(value||'').replace(/^mdi:/,'').split('-').map(x=>x.charAt(0).toUpperCase()+x.slice(1)).join('');const path=icons[key]||icons.mdiInformationOutline;this.shadowRoot.innerHTML=`<style>:host{display:inline-block;width:1.2em;height:1.2em;vertical-align:middle}svg{width:100%;height:100%;fill:currentColor}</style><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${path}"></path></svg>`;}
});
await import('../../custom_components/stremio/frontend/stremio-card-bundle.js?v=preview11');
const films=[['tt1375666','Inception','movie','2010','8.8'],['tt0111161','The Shawshank Redemption','movie','1994','9.3'],['tt0133093','The Matrix','movie','1999','8.7'],['tt0816692','Interstellar','movie','2014','8.7'],['tt0903747','Breaking Bad','series','2008–2013','9.5'],['tt1475582','Sherlock','series','2010–2017','9.1'],['tt0468569','The Dark Knight','movie','2008','9.0'],['tt0109830','Forrest Gump','movie','1994','8.8']];
const items=films.map(([id,title,type,year,rating],n)=>({id,imdb_id:id,title,name:title,type,year,rating,poster:`https://images.metahub.space/poster/medium/${id}/img`,thumbnail:`https://images.metahub.space/poster/medium/${id}/img`,genres:['Drama','Sci-Fi'],description:'Public title used to demonstrate the Stremio Cinema interface.',progress_percent:n===0?42:n===4?25:0,progress:n===0?42:n===4?25:0,season:type==='series'?1:undefined,episode:type==='series'?1:undefined,episode_title:type==='series'?'Pilot':undefined,recommendation_reason:'Example recommendation',runtime:8880}));
const library='sensor.stremio_demo_library_count',resume='sensor.stremio_demo_continue_watching_count',player='media_player.stremio_demo';
const hass={states:{[library]:{state:'8',attributes:{friendly_name:'Demo Library',items}},[resume]:{state:'2',attributes:{items:items.filter(i=>i.progress_percent>0)}},[player]:{state:'paused',attributes:{media_title:'Inception',media_position:3729,media_duration:8880,entity_picture:items[0].poster,poster:items[0].poster,progress_percent:42}}},entities:{[library]:{config_entry_id:'demo-only'},[player]:{config_entry_id:'demo-only'}},services:{stremio:{mark_watched:{},mark_unwatched:{},clear_resume_progress:{}}},language:'en',locale:{language:'en'},config:{unit_system:{length:'km'}},formatEntityState:s=>s.state,callService:async()=>{window.dispatchEvent(new CustomEvent('hass-notification',{detail:{message:'Demonstration only — no account changed'}}));},callWS:async message=>{
 const data=message.service_data||{};
 if(message.service==='browse_catalog') {const source=items.filter(i=>i.type===(data.media_type||'movie')); return {response:{items:data.skip?[]:source.map(({season,episode,...title})=>title),next_skip:(data.skip||0)+50,has_more:!data.skip}};}
 if(message.service==='search_catalog') return {response:{items:items.filter(i=>i.type===data.media_type&&i.title.toLowerCase().includes(data.query.toLowerCase()))}};
 if(message.service==='get_recommendations') return {response:{recommendations:items.slice(2)}};
 if(message.service==='get_similar_content') return {response:{similar:items.filter(i=>i.id!==data.media_id).slice(0,5),items:items.filter(i=>i.id!==data.media_id).slice(0,5)}};
 if(message.service==='get_streams') return {response:{streams:[{name:'Demo source · 1080p',title:'Example stream — fictional URL',url:'https://example.com/demo-video.mp4',quality:'1080p'},{name:'Demo source · 4K',title:'Example stream — fictional URL',url:'https://example.com/demo-4k.mp4',quality:'4K'}]}};
 if(message.service==='get_series_metadata') return {response:{metadata:{id:data.media_id,title:'Breaking Bad',seasons:[{number:1,title:'Season 1',episodes:[{number:1,title:'Pilot',id:'tt0903747:1:1',overview:'Example episode entry.'},{number:2,title:"Cat’s in the Bag…",id:'tt0903747:1:2',overview:'Example episode entry.'}]}]}}};
 if(message.service==='get_title_metadata') {const item=items.find(i=>i.id===data.media_id)||items[0];return {response:{metadata:{...item,runtime:'148 min',cast:['Example cast member'],director:['Example director']}}};}
 throw new Error('Unsupported demonstration action');
}};
function add(type,config,full=false){const card=document.createElement(type);card.setConfig({management_mode:true,library_entity:library,...config});card.hass=hass;if(full)card.classList.add('full');document.querySelector('#cards').append(card);}
add('stremio-continue-watching-card',{title:'Continue Watching · demo',entity:resume,columns:6,max_items:8,horizontal_scroll:true,card_height:300,tap_action:'details'},true);
add('stremio-recommendations-card',{title:'Recommendations · demo',max_items:3,columns:4,horizontal_scroll:true,card_height:290,tap_action:'details'},true);
add('stremio-browse-card',{title:'Discover movies',entity:player,default_type:'movie',default_view:'popular',max_items:24,columns:3,card_height:660});
add('stremio-browse-card',{title:'Discover series',entity:player,default_type:'series',default_view:'popular',max_items:24,columns:2,card_height:660});
add('stremio-library-card',{title:'My Library · demo',entity:library,max_items:8,columns:4,card_height:540,tap_action:'show_detail'},true);
add('stremio-player-card',{title:'Player · inherited controls',entity:player},true);
</script></html>
